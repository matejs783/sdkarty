name: Kontrola odpočtů
on:
  schedule:
    - cron: "0 6 * * *"     # 6:00 UTC = 7:00/8:00 českého času
  workflow_dispatch:         # umožní spustit ručně tlačítkem
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
